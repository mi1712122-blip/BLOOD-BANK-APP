<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Blood Bank Management System</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
  <div class="auth-container" style="--auth-bg-image: url('../../assets/images/login page.jpg')">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-droplet"></i>
        </div>
        <h1>Blood Bank</h1>
        <p>Login to your account</p>
      </div>

      <div id="alertContainer"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            required
          >
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password"
              required
            >
            <button type="button" class="toggle-password" data-target="password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label id="roleLabel" for="roleDropdownToggle">Login as</label>
          <div class="role-dropdown" id="roleDropdown">
            <select id="role" name="role" required class="role-select-native" tabindex="-1" aria-hidden="true">
              <option value="">Select your role</option>
              <option value="donor">Donor</option>
              <option value="organization">Organization</option>
              <option value="hospital">Hospital</option>
              <option value="admin">Admin</option>
            </select>
            <button
              type="button"
              class="role-dropdown-toggle"
              id="roleDropdownToggle"
              role="combobox"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="roleDropdownMenu"
              aria-labelledby="roleLabel roleDropdownValue"
              aria-required="true"
            >
              <span class="role-dropdown-value" id="roleDropdownValue">
                <span class="role-dropdown-placeholder">Select your role</span>
              </span>
              <i class="fas fa-chevron-down role-dropdown-chevron" aria-hidden="true"></i>
            </button>
            <ul class="role-dropdown-menu" id="roleDropdownMenu" role="listbox" aria-labelledby="roleLabel">
              <li class="role-dropdown-option" id="role-option-donor" role="option" tabindex="-1" data-value="donor" aria-selected="false">
                <span class="role-option-icon role-accent-donor" aria-hidden="true"><i class="fas fa-droplet"></i></span>
                <span class="role-option-text">Donor</span>
                <i class="fas fa-check role-option-check" aria-hidden="true"></i>
              </li>
              <li class="role-dropdown-option" id="role-option-organization" role="option" tabindex="-1" data-value="organization" aria-selected="false">
                <span class="role-option-icon role-accent-organization" aria-hidden="true"><i class="fas fa-building"></i></span>
                <span class="role-option-text">Organization</span>
                <i class="fas fa-check role-option-check" aria-hidden="true"></i>
              </li>
              <li class="role-dropdown-option" id="role-option-hospital" role="option" tabindex="-1" data-value="hospital" aria-selected="false">
                <span class="role-option-icon role-accent-hospital" aria-hidden="true"><i class="fas fa-hospital"></i></span>
                <span class="role-option-text">Hospital</span>
                <i class="fas fa-check role-option-check" aria-hidden="true"></i>
              </li>
              <li class="role-dropdown-option" id="role-option-admin" role="option" tabindex="-1" data-value="admin" aria-selected="false">
                <span class="role-option-icon role-accent-admin" aria-hidden="true"><i class="fas fa-shield-halved"></i></span>
                <span class="role-option-text">Admin</span>
                <i class="fas fa-check role-option-check" aria-hidden="true"></i>
              </li>
            </ul>
          </div>
          <span class="form-error"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Login
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <button type="button" id="googleSignInBtn" class="btn-google">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20" height="20">
          Continue with Google
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? 
          <a href="register.html">Create account</a>
        </p>
        <p>Back to 
          <a href="../../index.html">Home</a>
        </p>
      </div>
    </div>

    <!-- Background image is set via the --auth-bg-image CSS variable on the .auth-container element. Replace the URL above with your image path. -->
  </div>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="loading-spinner hidden">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script type="module" src="../../assets/js/firebase-config.js"></script>
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="auth-login.js"></script>
</body>
</html>
